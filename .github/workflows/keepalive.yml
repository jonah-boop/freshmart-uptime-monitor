name: Keep scheduled monitor active

on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record monthly repository activity
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-stamp
          git config user.name 'Fresh Mart Uptime Automation'
          git config user.email 'jonah@freshmart.com.ng'
          git add .github/keepalive-stamp
          git commit -m 'chore: keep scheduled monitor active' || exit 0
          git push
